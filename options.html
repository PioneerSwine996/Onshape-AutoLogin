<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; padding: 12px; width: 280px; }
      label { display: block; margin-bottom: 10px; }
      input[type="email"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 4px; }
      #status { margin-left: 8px; color: green; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <form id="form">
      <label>Email <input type="email" id="email" required autocomplete="username" /></label>
      <label>Password <input type="password" id="password" required autocomplete="current-password" /></label>
      <label><input type="checkbox" id="enabled" checked /> Auto-login enabled</label>
      <button type="submit">Save</button><span id="status"></span>
    </form>
    <p><small>Stored unencrypted in this Firefox profile's extension storage.</small></p>
    <script src="options.js"></script>
  </body>
</html>
